[project]
name = "mini-agent"
version = "0.1.0"
description = "A minimal Python agent project skeleton managed with uv"
readme = "README.md"
authors = [
    { name = "jh_ustc", email = "fangjinghang@mail.ustc.edu.cn" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mini-agent = "mini_agent:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
